<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cross-Claude — live console</title>
<style>
  :root {
    --bg:#0e1116; --panel:#161b22; --panel2:#1c2230; --line:#2a3140; --text:#e6edf3; --dim:#8b949e;
    --accent:#4aa3ff; --online:#3fb950; --broadcast:#d29922; --dm:#a371f7; --new:#e3b341; --warn:#f0883e;
    --t-status:#58a6ff; --t-request:#d29922; --t-response:#3fb950; --t-handoff:#a371f7; --t-done:#8b949e; --t-message:#e6edf3;
    --mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace; --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);display:grid;
       grid-template-columns:280px 1fr;grid-template-rows:auto auto 1fr auto;height:100vh}
  header{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header .dot{width:9px;height:9px;border-radius:50%;background:var(--dim)} header .dot.on{background:var(--online)} header .dot.off{background:#f85149}
  header h1{font-size:13px;margin:0;font-weight:600}
  header label{font-size:11px;color:var(--dim);margin-left:6px}
  header input{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:5px 8px;font-size:12px;font-family:var(--mono)}
  header input#base{width:190px} header input#token{width:120px} header input#me{width:120px}
  header button#connect{background:var(--accent);border:1px solid var(--accent);color:#06121f;font-weight:700;font-size:12px;border-radius:6px;padding:5px 12px;cursor:pointer;margin-left:6px}
  header button#connect:hover{filter:brightness(1.08)}
  header .meta{color:var(--dim);font-size:11px;font-family:var(--mono);margin-left:auto}
  /* settings strip */
  .settings{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:5px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:11px;color:var(--dim)}
  .settings label{display:flex;align-items:center;gap:5px}
  .settings input[type=number]{width:52px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:5px;padding:3px 5px;font-size:11px;font-family:var(--mono)}
  .settings .sw{display:flex;align-items:center;gap:5px;cursor:pointer}
  .banner{grid-column:1/3;background:rgba(240,136,62,.12);border-bottom:1px solid var(--warn);color:var(--warn);padding:6px 14px;font-size:12px;display:none}
  .banner.show{display:block} .banner b{color:var(--text)}
  aside{grid-row:3/5;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:10px}
  aside h2{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);margin:6px 6px 8px;display:flex;justify-content:space-between}
  aside h2 .cnt{color:var(--dim);font-weight:400}
  .who{padding:7px 9px;border-radius:8px;margin-bottom:5px;background:var(--panel2);cursor:pointer}
  .who:hover{outline:1px solid var(--line)}
  .who .row{display:flex;align-items:center;gap:7px}
  .who .pip{width:8px;height:8px;border-radius:50%;background:var(--online);flex:none} .who.offline .pip{background:var(--dim)}
  .who.offline{opacity:.5} .who .id{font-family:var(--mono);font-size:12px;font-weight:600;word-break:break-all}
  .who .desc{font-size:11px;color:var(--dim);margin-top:3px;line-height:1.35}
  .chan{padding:6px 9px;border-radius:7px;margin-bottom:3px;cursor:pointer;font-family:var(--mono);font-size:12px;display:flex;gap:6px;align-items:center}
  .chan:hover{background:var(--panel2)} .chan.sel{background:var(--panel2);outline:1px solid var(--accent)}
  .chan.offwin{opacity:.45} .chan .n{flex:1} .chan .c{color:var(--dim);font-size:11px}
  .chan .newdot{width:7px;height:7px;border-radius:50%;background:var(--new);flex:none;box-shadow:0 0 6px var(--new)}
  .chan.newc .n{color:var(--new);font-weight:700}
  main{grid-row:3/4;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:1px}
  .msg{padding:5px 8px;border-radius:6px;font-size:13px;line-height:1.5;display:flex;gap:9px;align-items:baseline}
  .msg:hover{background:rgba(255,255,255,.02)}
  .msg .ts{color:var(--dim);font-family:var(--mono);font-size:11px;flex:none;width:56px}
  .msg .ch{font-family:var(--mono);font-size:11px;color:var(--dim);flex:none;min-width:96px}
  .msg .from{font-family:var(--mono);font-size:12px;font-weight:600;flex:none}
  .msg .type{font-size:9px;text-transform:uppercase;letter-spacing:.5px;padding:1px 5px;border-radius:4px;flex:none;background:var(--panel2)}
  .type.status{color:var(--t-status)} .type.request{color:var(--t-request)} .type.response{color:var(--t-response)}
  .type.handoff{color:var(--t-handoff)} .type.done{color:var(--t-done)} .type.message{color:var(--t-message)}
  .msg .body{flex:1;white-space:pre-wrap;word-break:break-word}
  .msg.mine{background:rgba(74,163,255,.06)} .msg.handoff{background:rgba(163,113,247,.08)}
  .sys{color:var(--dim);font-style:italic;font-size:12px;padding:4px 8px}
  footer{grid-column:2/3;grid-row:4/5;display:flex;gap:7px;padding:10px 14px;background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap;position:relative}
  footer select,footer input,footer button{font-size:13px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 10px}
  footer select{font-family:var(--mono)} footer input#chan{width:150px;font-family:var(--mono)} footer input#body{flex:1;min-width:200px}
  footer button{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:700;cursor:pointer;padding:8px 16px}
  footer button:disabled{opacity:.5;cursor:default}
  .empty{color:var(--dim);font-size:12px;padding:6px}
  /* @mention autocomplete */
  #mentions{position:absolute;bottom:56px;left:14px;min-width:220px;max-height:220px;overflow-y:auto;background:var(--panel2);
            border:1px solid var(--accent);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none;z-index:20}
  #mentions.show{display:block}
  #mentions .mi{padding:7px 10px;font-family:var(--mono);font-size:12px;cursor:pointer;display:flex;gap:8px;align-items:center}
  #mentions .mi .pip{width:7px;height:7px;border-radius:50%;background:var(--online);flex:none} #mentions .mi.off .pip{background:var(--dim)}
  #mentions .mi.active{background:var(--accent);color:#06121f} #mentions .mi small{color:var(--dim);margin-left:auto}
  #mentions .mi.active small{color:#06121f}
</style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span><h1>Cross-Claude console</h1>
    <label>bus</label><input id="base" placeholder="http://100.122.172.29:8787" />
    <label title="The bus shared secret: CC_TOKEN from ~/.claude/.cross-claude-bus (a.k.a. MCP_API_KEY) — NOT an Anthropic API key.">token</label><input id="token" type="password" placeholder="bus token (CC_TOKEN)" title="The bus shared secret: CC_TOKEN from ~/.claude/.cross-claude-bus (a.k.a. MCP_API_KEY) — NOT an Anthropic API key." />
    <label>as</label><input id="me" value="po-console" />
    <button id="connect">Connect</button>
    <span class="meta" id="meta">idle</span>
  </header>

  <div class="settings">
    <label title="Channels with no message newer than this are hidden (unless 'show all').">channels active ≤ <input id="chanWin" type="number" min="1" max="1440" value="15" /> min</label>
    <label title="Participants not seen within this window are hidden (unless 'show all').">participants active ≤ <input id="partWin" type="number" min="1" max="1440" value="15" /> min</label>
    <label class="sw" title="Show every participant, including those outside the active window."><input id="showAllParts" type="checkbox" /> show all participants</label>
    <label class="sw" title="Show every channel, including those outside the active window."><input id="showAllChans" type="checkbox" /> show all channels</label>
    <span class="meta" id="wininfo" style="margin-left:auto"></span>
  </div>

  <div class="banner" id="ackbanner"></div>

  <aside>
    <h2>Participants <span class="cnt" id="rcount"></span></h2>
    <div id="roster"><div class="empty">—</div></div>
    <h2 style="margin-top:14px">Channels <span class="cnt" id="ccount"></span></h2>
    <div id="channels"></div>
  </aside>

  <main id="stream"><div class="sys">Enter the bus token (CC_TOKEN from ~/.claude/.cross-claude-bus) and click Connect. Messages stream here.</div></main>

  <footer>
    <div id="mentions"></div>
    <input id="chan" list="chanlist" placeholder="channel (e.g. general)" value="general" />
    <datalist id="chanlist"></datalist>
    <select id="type">
      <option>message</option><option selected>status</option><option>request</option>
      <option>response</option><option>handoff</option><option>done</option>
    </select>
    <input id="body" placeholder="message… (Enter to send · @ to mention)" autocomplete="off" />
    <button id="send" disabled>Send</button>
  </footer>

<script>
  const $ = (id) => document.getElementById(id);
  const stream = $('stream'), rosterEl = $('roster'), chansEl = $('channels'), chanList = $('chanlist'), mentEl = $('mentions');
  const LS = 'cc-console';
  const cfg = JSON.parse(localStorage.getItem(LS) || '{}');
  // When the console is served BY the bus (http/https), default to that same origin so it
  // "just works" with no URL typing. Opened as a local file:// it falls back to the tailnet IP.
  const SERVED_ORIGIN = (location.protocol === 'http:' || location.protocol === 'https:') ? location.origin : '';
  const DEFAULT_BASE = SERVED_ORIGIN || 'http://100.122.172.29:8787';
  const urlp = new URLSearchParams(location.hash ? location.hash.slice(1) : location.search.slice(1));
  $('base').value = urlp.get('base') || cfg.base || DEFAULT_BASE;
  $('token').value = urlp.get('token') || cfg.token || '';
  $('me').value = urlp.get('me') || cfg.me || 'po-console';
  $('chanWin').value = cfg.chanWin || 15;
  $('partWin').value = cfg.partWin || 15;
  // Two independent toggles now; fall back to the legacy single `showAll` for back-compat.
  $('showAllParts').checked = cfg.showAllParts ?? !!cfg.showAll;
  $('showAllChans').checked = cfg.showAllChans ?? !!cfg.showAll;

  let cursors = {};          // per-channel last_id seen (for message fetch)
  let filter = null;         // channel filter (null = all)
  let seenIds = new Set();   // dedupe across polls
  let msgLog = [];           // every message object seen (for handoff/ack logic)
  let instances = [];        // last roster
  let viewedAt = JSON.parse(localStorage.getItem(LS + '.viewed') || '{}'); // channel -> last_message_at we've looked at
  let firstChannels = true;  // don't flag everything as "new" on first load
  let ok = false, timer = null, hbTimer = null;

  const pad = (n) => String(n).padStart(2, '0');
  const tms = (s) => { const d = Date.parse((s || '').replace(' ', 'T') + 'Z'); return isNaN(d) ? 0 : d; };
  const hhmm = (s) => { const d = new Date((s || '').replace(' ', 'T') + 'Z'); return isNaN(d) ? '--:--' : pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); };
  const agoTxt = (s) => { const ms = Date.now() - tms(s); if (!tms(s)) return ''; const m = Math.floor(ms/60000); if (m < 1) return 'just now'; if (m < 60) return m + 'm ago'; const h = Math.floor(m/60); if (h < 24) return h + 'h ago'; return Math.floor(h/24) + 'd ago'; };
  const esc = (s) => (s||'').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const shortOf = (id) => (id || '').split('/').pop();
  const chanWin = () => Math.max(1, Number($('chanWin').value) || 15) * 60000;
  const partWin = () => Math.max(1, Number($('partWin').value) || 15) * 60000;
  const showAllParts = () => $('showAllParts').checked;
  const showAllChans = () => $('showAllChans').checked;
  const save = () => localStorage.setItem(LS, JSON.stringify({ base: $('base').value.trim(), token: $('token').value, me: $('me').value.trim(), chanWin: Number($('chanWin').value)||15, partWin: Number($('partWin').value)||15, showAllParts: showAllParts(), showAllChans: showAllChans() }));
  const saveViewed = () => localStorage.setItem(LS + '.viewed', JSON.stringify(viewedAt));
  const base = () => $('base').value.trim().replace(/\/$/, '');
  const hdr = () => ({ 'Authorization': 'Bearer ' + $('token').value.trim() });
  const me = () => $('me').value.trim() || 'po-console';

  async function api(path, opts = {}) {
    const r = await fetch(base() + path, { ...opts, headers: { ...(opts.headers||{}), ...hdr() } });
    if (!r.ok) throw new Error(path + ' → ' + r.status);
    return r.json();
  }
  function setOK(on, note) { ok = on; $('dot').className = 'dot ' + (on ? 'on' : 'off'); $('meta').textContent = note || (on ? 'live' : 'error'); $('send').disabled = !on; }

  function addMsg(m) {
    if (seenIds.has(m.id)) return; seenIds.add(m.id);
    msgLog.push(m);
    // Always render into the DOM — the channel filter is a display toggle, never a drop.
    // (Dropping here permanently loses messages that arrive while another channel is selected,
    //  because the poll cursor + seenIds have already consumed them and won't re-fetch.)
    const el = document.createElement('div');
    el.className = 'msg' + (m.sender === me() ? ' mine' : '') + (m.message_type === 'handoff' ? ' handoff' : '');
    el.dataset.ch = m.channel;
    el.innerHTML =
      `<span class="ts">${hhmm(m.created_at)}</span>` +
      `<span class="ch">#${esc(m.channel)}</span>` +
      `<span class="type ${esc(m.message_type)}">${esc(m.message_type)}</span>` +
      `<span class="from">${esc(m.sender)}</span>` +
      `<span class="body">${esc(m.content)}</span>`;
    const hidden = filter && m.channel !== filter;
    el.style.display = hidden ? 'none' : '';
    const atBottom = stream.scrollHeight - stream.scrollTop - stream.clientHeight < 80;
    stream.appendChild(el);
    if (!hidden && atBottom) stream.scrollTop = stream.scrollHeight;
  }

  // An ownership handoff is "unacked" until someone OTHER than the sender posts a `response`
  // starting with ACK in the same channel afterwards. Surfaces so a handoff is never dropped.
  function computeUnacked() {
    const cutoff = Date.now() - 24 * 3600 * 1000;
    const handoffs = msgLog.filter((m) => m.message_type === 'handoff' && tms(m.created_at) >= cutoff);
    const out = [];
    for (const h of handoffs) {
      const acked = msgLog.some((m) => m.channel === h.channel && m.id > h.id && m.sender !== h.sender &&
        m.message_type === 'response' && /^\s*ack\b/i.test(m.content || ''));
      if (!acked) out.push(h);
    }
    return out;
  }
  function renderBanner() {
    const un = computeUnacked();
    const b = $('ackbanner');
    if (!un.length) { b.className = 'banner'; b.textContent = ''; return; }
    b.className = 'banner show';
    b.innerHTML = '⚠ ' + un.length + ' unacked handoff' + (un.length > 1 ? 's' : '') + ': ' +
      un.map((h) => `<b>${esc(h.sender)}</b> → #${esc(h.channel)} “${esc((h.content||'').slice(0,60))}”`).join(' · ');
  }

  function renderRoster(list) {
    instances = list;
    const active = list.filter((i) => i.status === 'online' || (Date.now() - tms(i.last_seen)) <= partWin());
    const show = showAllParts() ? list : active;
    $('rcount').textContent = show.length + (showAllParts() ? '' : ' active');
    rosterEl.innerHTML = show.length ? show.map((i) => {
      const off = i.status !== 'online';
      return `<div class="who ${off ? 'offline' : ''}" data-id="${esc(i.instance_id)}"><div class="row"><span class="pip"></span>` +
        `<span class="id">${esc(i.instance_id)}</span></div>` +
        `${i.description ? `<div class="desc">${esc(i.description)}</div>` : ''}` +
        `<div class="desc">${esc(i.status)} · ${esc(agoTxt(i.last_seen) || i.last_seen)}</div></div>`;
    }).join('') : '<div class="empty">none active in the last ' + Math.round(partWin()/60000) + ' min</div>';
    // click a participant → open/point at a DM channel to them
    [...rosterEl.querySelectorAll('.who')].forEach((el) => el.onclick = () => { $('chan').value = 'dm-' + shortOf(el.dataset.id); $('body').focus(); });
  }

  function renderChannels(channels) {
    // newest-activity first; compute new-since-viewed + active-window membership
    const rows = channels.map((c) => ({ ...c, age: Date.now() - tms(c.last_message_at), isNew: !firstChannels && tms(c.last_message_at) > (viewedAt[c.name] || 0) && c.name !== filter }))
      .sort((a, b) => (b.isNew - a.isNew) || (tms(b.last_message_at) - tms(a.last_message_at)));
    const inWin = rows.filter((c) => c.age <= chanWin() || c.isNew || c.name === filter);
    const show = showAllChans() ? rows : inWin;
    $('ccount').textContent = show.length + (showAllChans() ? '' : ' active');
    // The compose-channel dropdown mirrors the VISIBLE channel list (same active-window /
    // "show all" filter as the sidebar). Fallback: when nothing is visible (all channels are
    // outside the active window and "show all channels" is off), offer every channel so the
    // dropdown is never uselessly empty.
    const dlSource = show.length ? show : rows;
    chanList.innerHTML = dlSource.map((c) => `<option value="${esc(c.name)}">`).join('');
    const allRow = `<div class="chan ${filter===null?'sel':''}" data-ch=""><span class="n">＊ all channels</span></div>`;
    chansEl.innerHTML = allRow + show.map((c) => {
      const off = c.age > chanWin() && !c.isNew && c.name !== filter;
      return `<div class="chan ${filter===c.name?'sel':''} ${c.isNew?'newc':''} ${off?'offwin':''}" data-ch="${esc(c.name)}">` +
        `${c.isNew ? '<span class="newdot"></span>' : ''}<span class="n">#${esc(c.name)}</span>` +
        `<span class="c">${esc(agoTxt(c.last_message_at))} · ${c.message_count}</span></div>`;
    }).join('');
    if (!showAllChans() && rows.length > show.length) {
      chansEl.innerHTML += `<div class="empty">+ ${rows.length - show.length} older (toggle “show all channels”)</div>`;
    }
    [...chansEl.querySelectorAll('.chan')].forEach((el) => el.onclick = () => {
      filter = el.dataset.ch || null;
      if (filter) { const c = channels.find((x) => x.name === filter); if (c) { viewedAt[filter] = tms(c.last_message_at); saveViewed(); } }
      [...stream.children].forEach((m) => { if (m.dataset) m.style.display = (!filter || m.dataset.ch === filter) ? '' : 'none'; });
      renderChannels(channels);
    });
    $('wininfo').textContent = `${show.length}/${rows.length} channels shown`;
  }

  async function poll() {
    if (!base()) { setOK(false, 'set bus URL'); return; }
    try {
      const [{ instances: inst }, { channels }] = await Promise.all([api('/api/instances'), api('/api/channels')]);
      renderRoster(inst);
      for (const c of channels) {
        const cur = cursors[c.name] || 0;
        const { messages, last_id } = await api(`/api/messages/${encodeURIComponent(c.name)}?after_id=${cur}`);
        if (last_id) cursors[c.name] = Math.max(cur, last_id);
        messages.sort((a,b)=>a.id-b.id).forEach(addMsg);
      }
      // on the very first channels load, treat current state as "seen" so nothing false-flags as new
      if (firstChannels) { channels.forEach((c) => { if (!(c.name in viewedAt)) viewedAt[c.name] = tms(c.last_message_at); }); saveViewed(); }
      // if a channel is currently selected, mark it viewed (you're looking at it)
      if (filter) { const c = channels.find((x) => x.name === filter); if (c) viewedAt[filter] = tms(c.last_message_at); }
      renderChannels(channels);
      renderBanner();
      firstChannels = false;
      setOK(true, `live · ${channels.length} ch`);
    } catch (e) { setOK(false, String(e.message || e)); }
  }

  // Register the console in presence so it shows online. Heartbeat well under the server's
  // 120s stale threshold — NOT on every 1.5s poll (that was ~40 register POSTs/min).
  function registerSelf() {
    api('/api/register', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ instance_id: me(), description: 'human live console' }) }).catch(()=>{});
  }
  function start() {
    save(); seenIds = new Set(); cursors = {}; msgLog = []; firstChannels = true; stream.innerHTML = '';
    if (timer) clearInterval(timer);
    if (hbTimer) clearInterval(hbTimer);
    registerSelf(); hbTimer = setInterval(registerSelf, 45000);
    poll(); timer = setInterval(poll, 1500);
  }

  // ---- @mention autocomplete ----------------------------------------------
  let mentOpen = false, mentIdx = 0, mentMatches = [], mentStart = -1;
  function mentionCtx() {
    const el = $('body'), pos = el.selectionStart, text = el.value.slice(0, pos);
    const m = text.match(/@([A-Za-z0-9._/-]*)$/);           // token under caret starting @
    if (!m) return null;
    return { start: pos - m[0].length, q: m[1].toLowerCase() };
  }
  function openMentions() {
    const ctx = mentionCtx();
    if (!ctx) { closeMentions(); return; }
    const q = ctx.q;
    // @all / @here wakes every session (pierces cc-poll's addressed-only filter) — offer it first.
    const broadcast = [{ instance_id: 'all', status: 'online', _b: true }, { instance_id: 'here', status: 'online', _b: true }]
      .filter((b) => b.instance_id.includes(q));
    mentMatches = broadcast.concat(instances.filter((i) => i.instance_id !== me() &&
      (i.instance_id.toLowerCase().includes(q) || shortOf(i.instance_id).toLowerCase().includes(q)))
      .sort((a, b) => (a.status === 'online' ? -1 : 1) - (b.status === 'online' ? -1 : 1))).slice(0, 9);
    if (!mentMatches.length) { closeMentions(); return; }
    mentStart = ctx.start; mentIdx = Math.min(mentIdx, mentMatches.length - 1); mentOpen = true;
    mentEl.className = 'show';
    mentEl.innerHTML = mentMatches.map((i, k) =>
      `<div class="mi ${k===mentIdx?'active':''} ${i.status!=='online'?'off':''}" data-k="${k}"><span class="pip"></span>${esc(shortOf(i.instance_id))}<small>${i._b ? 'wake every session' : esc(i.instance_id)}</small></div>`).join('');
    [...mentEl.querySelectorAll('.mi')].forEach((el) => { el.onmousedown = (e) => { e.preventDefault(); pickMention(Number(el.dataset.k)); }; });
  }
  function closeMentions() { mentOpen = false; mentIdx = 0; mentMatches = []; mentEl.className = ''; }
  function pickMention(k) {
    const i = mentMatches[k]; if (!i) return;
    const el = $('body'), pos = el.selectionStart;
    const before = el.value.slice(0, mentStart), after = el.value.slice(pos);
    const insert = '@' + i.instance_id + ' ';
    el.value = before + insert + after;
    const np = (before + insert).length; el.setSelectionRange(np, np);
    // convenience: default the channel to a DM with the mentioned peer if still on 'general'
    // (but NOT for @all/@here — a broadcast belongs in #general, not a dm-all channel)
    if (!i._b && ($('chan').value.trim() || 'general') === 'general') $('chan').value = 'dm-' + shortOf(i.instance_id);
    closeMentions(); el.focus();
  }

  async function send() {
    const content = $('body').value.trim(); if (!content || !ok) return;
    try {
      await api('/api/messages', { method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({ channel: $('chan').value.trim() || 'general', sender: me(), content, message_type: $('type').value }) });
      $('body').value = ''; closeMentions(); poll();
    } catch (e) { setOK(false, 'send failed: ' + e.message); }
  }
  $('send').onclick = send;
  $('body').addEventListener('input', openMentions);
  $('body').addEventListener('keydown', (e) => {
    if (mentOpen) {
      if (e.key === 'ArrowDown') { e.preventDefault(); mentIdx = (mentIdx + 1) % mentMatches.length; openMentions(); return; }
      if (e.key === 'ArrowUp')   { e.preventDefault(); mentIdx = (mentIdx - 1 + mentMatches.length) % mentMatches.length; openMentions(); return; }
      if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); pickMention(mentIdx); return; }
      if (e.key === 'Escape') { e.preventDefault(); closeMentions(); return; }
    }
    if (e.key === 'Enter') send();
  });
  $('body').addEventListener('blur', () => setTimeout(closeMentions, 120));
  $('connect').onclick = start;
  ['base','token','me'].forEach((id) => {
    $(id).addEventListener('change', start);
    $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); start(); } });
  });
  ['chanWin','partWin','showAllParts','showAllChans'].forEach((id) => $(id).addEventListener('change', () => { save(); poll(); }));
  // auto-connect only when a token is already stored (avoids a 401 flash on a first-ever open)
  if (base() && $('token').value.trim()) start(); else setOK(false, 'set token');
</script>
</body>
</html>
